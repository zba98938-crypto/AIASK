[project]
name = "aiask-quant-core"
version = "0.1.0"
description = "Shared AIASK quant primitives without MCP or Strategy Factory ownership."
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "pydantic==2.13.4",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "numba==0.61.2",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiask_quant_core"]
