name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Read-only by default. No job here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # The packages are consumed from source via pytest.ini pythonpath, so only
        # the runtime imports the suites actually touch are installed here.
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pytest==9.0.2" \
            "pytest-asyncio==1.3.0" \
            "pydantic==2.13.4" \
            "fastapi==0.133.1" \
            "uvicorn==0.41.0" \
            "mcp>=2.0,<3.0" \
            "httpx" \
            "pandas" \
            "numpy"
          # The mcp range mirrors every package's pyproject. The server modules
          # import 2.x APIs at module scope, so installing 1.x here turns ~20
          # tests red for a reason that has nothing to do with the change under
          # test.

      - name: Byte-compile every package
        run: |
          python -m compileall -q packages scripts tools

      # Every package gates. strategy-factory and akshare-mcp used to run with
      # `continue-on-error` on the grounds of a "known-red baseline"; both are
      # green, so a non-blocking run only meant a regression in the two largest
      # packages (1900+ tests, including the formula-execution security suite)
      # could not fail the build.
      - name: agent
        run: python -m pytest -q tests
        working-directory: packages/agent

      - name: aiask-quant-core
        run: python -m pytest -q tests
        working-directory: packages/aiask-quant-core

      - name: finance-mcp-servers
        run: python -m pytest -q tests
        working-directory: packages/finance-mcp-servers

      - name: strategy-factory
        run: python -m pytest -q tests
        working-directory: packages/strategy-factory

      - name: akshare-mcp
        run: python -m pytest -q tests
        working-directory: packages/akshare-mcp

      - name: aiask-skills
        run: python -m pytest -q tests
        working-directory: packages/aiask-skills

      - name: data-mcp
        run: python -m pytest -q tests
        working-directory: packages/data-mcp

      - name: reference-host
        # Installed so `import aiask_reference_host` resolves; its isolation test
        # asserts the import graph stays narrow, not that the package is absent.
        run: |
          python -m pip install -e . --no-deps
          python -m pytest -q tests
        working-directory: packages/reference-host
