name: advisory-refresh

# Scheduled refresh of the offline supply-chain advisory ledger from OSV.
#
# Ordinary test runs and pull requests never reach the network: they read the
# committed ledger only. This job is the single place where upstream advisory
# data is pulled in, and it opens a pull request rather than pushing to a
# branch directly, so every change to security data still gets reviewed.

on:
  schedule:
    # Weekly, Monday 03:17 UTC. Off the hour to avoid the top-of-hour rush.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Minimum needed to open a PR with the refreshed ledger.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh ledger from OSV
        run: python scripts/security/refresh_advisory_ledger.py --write

      - name: Validate the refreshed ledger offline
        # The ledger contract tests must pass against the new data before it is
        # proposed; a refresh that breaks the constraint grammar is worse than
        # stale data.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==9.0.2" "pytest-asyncio==1.3.0" "pydantic==2.13.4" "fastapi==0.133.1"
          python -m pytest -q tests/test_dependency_advisory_ledger.py
        working-directory: packages/agent

      - name: Open a pull request if the ledger changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/advisory-ledger-refresh
          title: "chore: refresh offline advisory ledger from OSV"
          commit-message: "chore: refresh offline advisory ledger from OSV"
          body: |
            Automated refresh of `packages/agent/src/aiask_agent/data/known_advisories.json`
            from the OSV API.

            The offline ledger contract tests were run against the refreshed data
            before this PR was opened. Review the version constraints before merging.
          add-paths: |
            packages/agent/src/aiask_agent/data/known_advisories.json
