[pytest]
asyncio_default_fixture_loop_scope = function
pythonpath =
    packages/agent/src
    packages/akshare-mcp/src
    packages/aiask-quant-core/src
    packages/strategy-factory/src
    packages/aiask-skills/src
    packages/data-mcp/src
    packages/finance-mcp-servers/src
    packages/reference-host/src
# Every package's suite, so a root-level `pytest` run is the whole repository.
# It previously listed only agent and strategy-factory, which silently excluded
# ~1100 tests — including all of akshare-mcp and aiask-quant-core — from any run
# started at the repository root.
testpaths =
    packages/agent/tests
    packages/aiask-quant-core/tests
    packages/aiask-skills/tests
    packages/akshare-mcp/tests
    packages/data-mcp/tests
    packages/finance-mcp-servers/tests
    packages/reference-host/tests
    packages/strategy-factory/tests
